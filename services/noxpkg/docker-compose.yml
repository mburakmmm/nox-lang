# services/noxpkg/docker-compose.yml — buradan (nox-lang deposunun
# İÇİNDEN) çalıştırılmalıdır: `docker compose -f services/noxpkg/
# docker-compose.yml up --build` (build context'in DEPO KÖKÜNE
# İŞARET ettiğine dikkat — Dockerfile compiler/stdlib/runtime'a
# ihtiyaç duyar).
#
# `NOXPKG_ADMIN_PASSWORD_HASH`/`NOXPKG_SESSION_SECRET` ortamdan
# okunur (`.env` dosyası ya da kabuk export'u) — ASLA bu dosyaya
# GÖMÜLMEZ. Şifre hash'i üretmek İçin:
#   noxc run services/noxpkg/scripts/gen_admin_hash.nox -- '<sifre>'
services:
  noxpkg:
    build:
      context: ../..
      dockerfile: services/noxpkg/Dockerfile
    environment:
      NOXPKG_ADMIN_PASSWORD_HASH: ${NOXPKG_ADMIN_PASSWORD_HASH:?NOXPKG_ADMIN_PASSWORD_HASH ayarlanmali}
      NOXPKG_SESSION_SECRET: ${NOXPKG_SESSION_SECRET:?NOXPKG_SESSION_SECRET ayarlanmali}
    # **DÜZELTİLDİ (task_d6eb2053, bkz. runtime/stdlib_shims/http_server.zig'in
    # `bindAndListen` belge notu):** `nox.http.serve*` ARTIK `0.0.0.0`e
    # (TÜM arayüzler, konteynerin KENDİ ağ ad alanı İÇİNDE) bağlanıyor —
    # ÖNCEDEN burada kullanılan `network_mode: host` workaround'u ARTIK
    # GEREKMEZ (ve GERÇEKTEN, dil-seviyesi düzeltmeden SONRA `host` modu
    # BIRAKILSAYDI sunucu HOST'un TÜM arayüzlerinde dinlerdi — İSTENEN
    # "sadece loopback + Cloudflare Tunnel" tasarımını BOZARDI). Normal
    # köprü (bridge) ağı + AÇIKÇA `127.0.0.1:`e SINIRLANDIRILMIŞ port
    # eşlemesi hem BAĞLANTIYI SAĞLAR (host'un loopback'i → Docker NAT →
    # konteynerin `0.0.0.0:8080`ü) HEM DE güvenlik özelliğini KORUR
    # (host'un DIŞ arayüzlerinden HİÇBİR paket konteynere ULAŞMAZ).
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
