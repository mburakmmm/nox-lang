name: Yamalı QBE kur (önbellekli)
description: >
  `scripts/build_qbe.sh` ile sabitlenmiş QBE 1.3'ü (upstream amd64_win yamalı; release arşivine giren QBE ile aynı) derler ve
  `$RUNNER_TEMP/qbe-bin` altına koyup PATH'e ekler. Önbellek anahtarı betik + kaynak arşivin içerik özetidir: ikisinden biri
  değişirse yeniden derlenir. Yalnızca macOS/Linux (Windows ci.yml'de kendi PowerShell adımıyla derler). Önce `actions/checkout`.

runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/qbe-bin
        key: qbe-patched-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_qbe.sh', 'third_party/qbe/qbe-1.3.tar.xz') }}

    - name: qbe derle (yamalı)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        scripts/build_qbe.sh "$RUNNER_TEMP/qbe-bin/qbe"

    - name: PATH'e ekle
      shell: bash
      run: |
        set -euo pipefail
        test -x "$RUNNER_TEMP/qbe-bin/qbe"
        echo "$RUNNER_TEMP/qbe-bin" >>"$GITHUB_PATH"
