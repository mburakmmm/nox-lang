name: noxc-nightly

# noxc-nightly (project/noxc-nightly-selfhost-plani-2026-11.md, Aşama 0.9): normal `noxc` + Nox ile yazılmış bileşenler (`selfhost/`). Günlük + elle tetikleme.
# Bu iş akışı kararlı sürüm hattını (`release.yml`, `noxc upgrade`) ETKİLEMEZ: sonuç yalnızca bir iş akışı artifact'ıdır (`noxc-nightly-<os>-<tarih>`).
# GitHub pre-release yayımlamak (`nightly-YYYY-MM-DD`) varsayılan olarak KAPALIDIR; yalnızca elle tetiklemede `publish: true` verilirse çalışır (dışarıya açık, geri alınması zor bir eylem).
# Farksal adım Zig bileşenini `noxc-nightly --frontend nox` ile karşılaştırır (Aşama 1: lexer).

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: "nightly-YYYY-MM-DD GitHub pre-release'ini de yayımla (varsayılan: hayır, yalnızca artifact)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nightly:
    name: noxc-nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Zig 0.16.0 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Zig 0.16.0 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      # Nightly yalnızca yerel LLVM backend'ini kullanır (`--selfhost-obj`): clang gerekir (ubuntu-latest ve macos-latest'te hazır).
      - name: Kararlı noxc + çalışma zamanı (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
      - name: noxc-nightly
        run: zig build nightly -Doptimize=ReleaseFast
      - name: Bağlı bileşenler çalışıyor mu
        run: ./zig-out/bin/noxc-nightly selfhost-info compiler/main.zig
      - name: "Farksal test koşucusu (Zig ↔ Nox: lexer, parser, biçimlendirici; depo + mutasyonlu girdiler)"
        run: zig build frontend-diff-test
      # R2-L (v2.2.56): kalıcı perf kapıları. v2.2.55/56 ölçümleri (992 KB korpus, ReleaseFast): lexer 0,63×, parse 0,80×, fmt 0,79× (Nox/Zig). Eşikler CI koşucusu gürültüsü için
      # bol paylı (ölçülenin ~1,6-2×'i) ama eski 3× bütçeden sıkıdır: bir tahsis/arena/algoritma gerilemesi (ör. bayt başına arena çifti = 1,9× lexer) kırmızı yapar.
      - name: Nox lexer/parse/fmt hız bütçesi (lexer ≤ 1,2×, parse ≤ 1,3×, fmt ≤ 1,3× Zig)
        run: |
          cat stdlib/nox/*.nox selfhost/lexer.nox selfhost/parser.nox selfhost/formatter.nox > "$RUNNER_TEMP/big.nox"
          ./zig-out/bin/noxc-nightly lex-bench "$RUNNER_TEMP/big.nox" 20 --max-ratio=1.2
          ./zig-out/bin/noxc-nightly parse-bench "$RUNNER_TEMP/big.nox" 20 --max-ratio=1.3
          ./zig-out/bin/noxc-nightly fmt-bench "$RUNNER_TEMP/big.nox" 20 --max-ratio=1.3
      - name: Nox bellek kapıları (art arda çağrıda RSS büyümesi ≤ 2×; ayrı süreç tepe RSS)
        run: |
          NOXC_NIGHTLY=./zig-out/bin/noxc-nightly sh scripts/selfhost_bench.sh parse-bench "$RUNNER_TEMP/big.nox" 20
          NOXC_NIGHTLY=./zig-out/bin/noxc-nightly sh scripts/selfhost_bench.sh fmt-bench "$RUNNER_TEMP/big.nox" 20
      # R2-L (v2.2.59): dil çekirdeği Nox/C kapısı. Ölçüt donanımdan bağımsız llvm/c oranıdır (aynı koşucuda C ile ölçülür); taban çizgisi macOS aarch64'te alındığından yalnızca macOS'ta kapı, tolerans 1,25×.
      - name: Dil çekirdeği Nox/C kapısı (lang_perf, macOS)
        if: runner.os == 'macOS'
        run: python3 benchmarks/lang_perf/run.py --no-python --no-qbe --repeat 3 --check benchmarks/lang_perf/baseline.json --tolerance 1.25
      - name: "GC duraklama kapısı (cycle_gc_pause, ort. ≤ 400 ns, en kötü ≤ 40 ms)"
        run: python3 scripts/gc_pause_gate.py
      - name: Derleyici-türü kıyas seti (Nox ↔ Zig)
        run: benchmarks/compiler_bench/run.sh
      - name: Artifact adı
        id: name
        run: echo "name=noxc-nightly-${{ runner.os }}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: zig-out/bin/noxc-nightly
          if-no-files-found: error
          retention-days: 14

  publish:
    name: nightly-YYYY-MM-DD pre-release (yalnızca elle + publish=true)
    needs: nightly
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pre-release oluştur (Latest'i DEĞİŞTİRMEZ)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="nightly-$(date -u +%Y-%m-%d)"
          for d in artifacts/*/; do n=$(basename "$d"); (cd "$d" && tar -czf "../$n.tar.gz" noxc-nightly); done
          gh release create "$tag" artifacts/*.tar.gz --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --title "$tag" --notes "Deneysel noxc-nightly (Nox ile yazılmış bileşenler). Kararlı sürüm DEĞİLDİR; noxc upgrade bunu seçmez."
