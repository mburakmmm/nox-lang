name: CI

# Faz Q.2 (bkz. docs/uretim-hazirlik-analizi.md): her push/PR'da `zig build
# test`i HEM Debug HEM ReleaseFast modunda çalıştırır.
#
# Faz R.1/R.2/R.3: `runtime/async_rt` artık aarch64 VE x86-64'ü, macOS VE
# Linux'u destekliyor (bkz. spec §3.8-§3.10) — matris ÜÇ GERÇEK kombinasyonu
# kapsıyor: macOS/aarch64 (Apple Silicon), Linux/x86-64 (GitHub'ın standart
# `ubuntu-latest` runner'ı — bu, Faz R.2'nin x86-64 fiber kodunun yalnızca
# YEREL Rosetta çevirisiyle DEĞİL GERÇEK donanımda da doğrulanmasını sağlar),
# Linux/aarch64 (`ubuntu-24.04-arm`). Linux'ta `qbe` Homebrew'de OLMADIĞINDAN
# KAYNAKTAN derlenir (bkz. `qbe-source` adımı — Faz R.3'ün Docker doğrulaması
# SIRASINDA GERÇEKTEN keşfedilen bir hata: kaynaktan derlenen bir `qbe`nin
# BUILD-TIME varsayılan hedefi macOS'un Homebrew paketinden FARKLIDIR, bu
# YÜZDEN `compiler/qbe_target.zig` `-t`yi HER ZAMAN AÇIKÇA geçer).
#
# **Zig kurulumu — `mlugg/setup-zig@v1` KULLANILMAZ (Faz CC.1'in ARDINDAN
# GERÇEKTEN keşfedilen bir hata):** o eylem, GERÇEK/etiketli bir sürüm
# (`"0.16.0"`, dev-snapshot DEĞİL) İÇİN "official" yedek URL'sini HER ZAMAN
# `ziglang.org/builds/...` OLARAK KURAR — bu yol SADECE `master` dev-
# snapshot'ları İÇİN doğrudur, GERÇEK etiketli sürümler `ziglang.org/
# download/<sürüm>/...` altındadır (ziglang.org'un KENDİ `download/index.
# json`ıyla DOĞRULANDI). Sonuç: TÜM mirror'lar + "official" 404/503 İLE
# başarısız oluyordu (`Zig 0.16.0 fetch` adımı, ~1 dakikada ÇÖKÜYORDU) —
# bu bir Zig/ağ kesintisi DEĞİLDİ. Düzeltme: doğru URL'den DOĞRUDAN indirip
# `$GITHUB_PATH`a eklemek.
#
# **`zig build test`den ÖNCE AYRI, TAM bir `zig build` adımı — GERÇEK,
# TEKRARLANABİLİR bir "soğuk önbellek" yarış durumu KEŞFEDİLDİ:** `.zig-
# cache`/`zig-out` TAMAMEN TEMİZ (`rm -rf`) bir durumdan `zig build test`
# DOĞRUDAN çalıştırıldığında, `noxc`/`noxlsp`yi bir ALT SÜREÇ olarak
# ÇAĞIRAN test dosyaları (`tests/cli/*.zig`) ARA SIRA `processSpawnPosix`
# İLE ÇÖKÜYORDU — `noxc`nin KENDİSİ HENÜZ tam olarak kurulmamışken (`zig
# build test`in KENDİ iç `install_noxc`/`install_noxrt` adımlarının
# TAMAMLANMASI İLE test ikililerinin bu kurulu ikiliyi ÇAĞIRMASI ARASINDA
# bir yarış — `test_step.dependOn(&install_noxc.step)` GİBİ Step-seviyesi
# bağımlılıklar DOĞRU KURULU olsa BİLE). Yerel olarak `rm -rf .zig-cache
# zig-out && zig build test` İLE %100 TEKRARLANABİLİR şekilde DOĞRULANDI
# (hatta `noxc`/`noxlsp`ye HİÇ dokunmayan `lsp_test.zig` BİLE etkilendi).
# **Düzeltme (yerel olarak `zig build` (TAM kurulum) SONRA `zig build
# test` İKİ AYRI komut olarak çalıştırılınca sorunun TAMAMEN ORTADAN
# KALKTIĞI doğrulandı):** her mod (Debug/ReleaseFast) İÇİN önce SALT
# `zig build` (o `-Doptimize` İLE), SONRA `zig build test` (AYNI mod) —
# ikinci komut çalıştığında `install_noxc`/`install_noxrt` ZATEN
# TAMAMLANMIŞ/önbelleklenmiş OLDUĞUNDAN yarış PENCERESİ tamamen KAPANIR.
#
# Faz LL (bkz. nox-teknik-spesifikasyon.md §3.71): YUKARIDAKİ 3-platform
# matrisinin YANINDA (İÇİNDE DEĞİL) AYRI bir `windows-frontend` işi VAR.
# LL.1 yalnızca derleyici ön-ucunu doğruluyordu; LL.2-LL.5 runtime'ın
# TAMAMINI (fiber/reaktör/soket/self-pipe) Windows'a taşıdı; LL.6 artık
# `qbe`yi KAYNAKTAN derleyip GERÇEK bir Nox programını uçtan uca (`noxc
# run`) ÇALIŞTIRIYOR — bu işin ADI ("yalnızca derleyici ön-ucu — Faz
# LL.1") artık TARİHSEL, kapsamı bundan ÇOK DAHA GENİŞ (LL.8'de, TÜM
# roadmap bitince güncellenecek).

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (aarch64)
            zig_arch: aarch64-macos
          - os: ubuntu-latest
            name: Linux (x86-64)
            zig_arch: x86_64-linux
          - os: ubuntu-24.04-arm
            name: Linux (aarch64)
            zig_arch: aarch64-linux
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Zig kur
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-${{ matrix.zig_arch }}-0.16.0.tar.xz"
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-${{ matrix.zig_arch }}-0.16.0" >>"$GITHUB_PATH"

      - name: qbe kur (macOS)
        if: runner.os == 'macOS'
        run: brew install qbe

      - name: qbe kur (Linux — kaynaktan derle)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o /tmp/qbe.tar.xz https://c9x.me/compile/release/qbe-1.3.tar.xz
          tar xf /tmp/qbe.tar.xz -C /tmp
          make -C /tmp/qbe-1.3 -j"$(nproc)"
          sudo cp /tmp/qbe-1.3/qbe /usr/local/bin/qbe

      - name: zig build (Debug)
        run: zig build

      - name: zig build test (Debug)
        run: zig build test

      - name: zig build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: zig build test (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast

  # Faz LL.1 (bkz. nox-teknik-spesifikasyon.md §3.71): GERÇEK Windows
  # desteği YOK — `runtime/async_rt/io_reactor.zig` şu an yalnızca macOS
  # (kqueue) VE Linux (epoll) uyguluyor (dosya-seviyesi bir `comptime`
  # `@compileError`, bkz. LL.2+). AMA `noxc`/`noxlsp` (derleyicinin
  # KENDİSİ) HİÇBİR POSIX-özgü çağrı (`std.posix.*`/`std.c.*`)
  # İÇERMEDİĞİNDEN, `build.zig`nin `noxc` adımı (runtime'a/`noxrt`e HİÇ
  # BAĞIMLI DEĞİL — bkz. o adımın belge notu) VE `compiler/lib.zig`nin
  # (lexer/parser/checker/module_loader) testleri (`frontend-test` adımı)
  # native Windows'ta İLKE OLARAK çalışabilir olmalı. Bu iş TAM OLARAK bu
  # iddiayı GERÇEK bir `windows-latest` çalıştırıcısında doğrular — ana
  # 3-platform matrisinin YANINDA, İÇİNDE DEĞİL (o matrisin TAMAMI —
  # `qbe`/`cc` gerektiren `build`/`test` adımları dahil — Windows'ta HENÜZ
  # ÇALIŞMAZ, bkz. LL.2-LL.7 yol haritası).
  windows-frontend:
    name: Windows (yalnızca derleyici ön-ucu — Faz LL.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zig kur
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile "$env:RUNNER_TEMP\zig.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig-x86_64-windows-0.16.0"

      - name: zig build noxc (yalnızca derleyici ön-ucu + stdlib)
        run: zig build noxc

      - name: zig build frontend-test (yalnızca lexer/parser/checker testleri)
        run: zig build frontend-test

      - name: Duman testi — noxc.exe check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Content -Path smoke.nox -Value "print(1)" -NoNewline
          & ".\zig-out\bin\noxc.exe" check smoke.nox
          if ($LASTEXITCODE -ne 0) { throw "noxc check basarisiz (exit $LASTEXITCODE)" }

      # Faz LL.2/LL.3 (bkz. nox-teknik-spesifikasyon.md §3.71): `cc`/`gcc`
      # (MinGW-w64) `windows-latest`te VARSAYILAN olarak `C:\mingw64\bin`
      # altında PATH'te BULUNDUĞU (GERÇEK bir keşif adımıyla DOĞRULANDI,
      # commit geçmişine bkz.) — `build.zig`nin `compile_swap_asm` adımı
      # (QBE'nin AT&T assembly'sini `cc -c` İLE derleyen) BU YÜZDEN
      # native windows-latest'te ÇALIŞABİLİR. `async-rt-test` adımı, TÜM
      # `noxrt`in (dolayısıyla HENÜZ Windows'a taşınmamış TÜM stdlib_shims'in)
      # BEKLENMESİNE GEREK KALMADAN, YALNIZCA fiber/io_reactor/scheduler/
      # channel katmanının (Windows x64 fiber assembly'si + `WSAPoll`
      # tabanlı reaktör DAHİL) GERÇEKTEN native Windows'ta ÇALIŞTIĞINI
      # doğrular (bkz. o build.zig adımının belge notu, "runtime/
      # stdlib_shims'e hiç bağımlı değil").
      - name: zig build async-rt-test (yalnızca fiber/io_reactor/scheduler/channel)
        run: zig build async-rt-test

      # Faz LL.4/LL.5 SONRASI (bkz. nox-teknik-spesifikasyon.md §3.71):
      # runtime'ın TAMAMI (HPy köprüsü DAHİL) GERÇEK Windows CI'de sıfır
      # hatayla derleniyor. Faz LL.6: `noxrt.o` bir ARA (GERÇEK bir Zig
      # derleyici hatası yüzünden — bkz. `build.zig`nin `swap_asm_o_path`
      # belge notu, "zig build-obj, COFF hedefinde addObjectFile ile
      # eklenen HAM bir nesne dosyası VARKEN Zig'in KENDİ derlediği TÜM
      # içeriği SESSİZCE atıyor") yalnızca 515 bayta düşüyordu — `build.
      # zig`de fiber assembly'si Windows'ta `noxrt.o`nun DIŞINDA AYRI
      # kurulup nihai `cc` bağlamasına AYRI bir girdi olarak eklenerek
      # (bkz. `compiler/main.zig`nin `cc_argv`ı) ÇÖZÜLDÜ.
      - name: zig build (TAM — noxrt.o dahil runtime)
        run: zig build

      # Faz LL.6 (bkz. nox-teknik-spesifikasyon.md §3.71): `qbe`nin Windows
      # İçin ÖNCEDEN derlenmiş bir paketi YOK (macOS'un Homebrew'ü/Linux'un
      # paket yöneticisi gibi) — Linux CI'nin KENDİ "kaynaktan derle" deseni
      # (yukarısı) İZLENİR, TEK farkla: `make` yerine DOĞRUDAN `cc` (MinGW'in
      # `cc`si) — QBE'nin Makefile'ı POSIX `sh`/`case`/`uname`e GÜVENİR,
      # PowerShell'de GÜVENİLİR ÇALIŞMAZ. **İlk girişimde GERÇEK CI'de
      # bulunan 2 hata:** (1) `main.o: config.h` — Makefile'ın `config.h`
      # kuralı yalnızca TEK bir `#define Deftgt ...` SATIRI üretiyor (bir
      # derleme-zamanı VARSAYILAN hedef — `compiler/qbe_target.zig` zaten
      # `-t`yi HER ZAMAN AÇIKÇA geçtiğinden bu değerin KENDİSİ ÖNEMLİ
      # DEĞİL, dosyanın SADECE VAR OLMASI yeterli); (2) kaynaklar TEK bir
      # dizinde DEĞİL — `amd64/`/`arm64/`/`rv64/` alt dizinlerindeki
      # backend dosyaları da (Makefile'ın `AMD64OBJ`/`ARM64OBJ`/`RV64OBJ`
      # listeleri) DERLENMELİ, yalnızca üst dizindeki `*.c` YETERSİZ.
      # **Faz LL.6 — QBE 1.3'ün amd64_win backend'inde GERÇEK bir upstream
      # hatası bulundu (kaynak koduna bakılarak, sonra macOS'ta derlenip
      # assembly çıktısı incelenerek DOĞRULANDI — bkz. nox-teknik-
      # spesifikasyon.md §3.71):** `amd64/winabi.c`nin `lower_func_
      # parameters`ı, YIĞINDAN (stack'ten) geçirilen bir parametreyi
      # yüklerken (`APS_InlineOnStack`, struct OLMAYAN dal) sınıfı HER ZAMAN
      # `Kl` (64-bit TAMSAYI) olarak SABİTLİYOR — parametre GERÇEKTE bir
      # `f64` İSE, bu YÜKLEME bir tamsayı yazmacına (`%r10` gibi) yapılıyor,
      # AMA DEĞER SONRADAN `movsd` (yalnızca XMM yazmaçlarını KABUL EDEN bir
      # SSE komutu) İLE kullanılınca `cc: ... Error: operand type mismatch
      # for 'movsd'` İLE bağlayıcı/assembler HATASI VERİYOR (`JsonValue.
      # __init__`in `n: f64` alanı — HER Nox programı `stdlib/nox/core.
      # nox`u KOŞULSUZ merge ettiğinden, HATA `print(1)` KADAR basit bir
      # programda BİLE tetiklenir). Düzeltme TEK satır: `Kl` yerine `instr->
      # cls` (parametrenin GERÇEK sınıfı — `APS_Register` dalının ZATEN
      # doğru yaptığı gibi).
      - name: qbe kur (Windows — kaynaktan, dogrudan cc ile derle)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://c9x.me/compile/release/qbe-1.3.tar.xz" -OutFile "$env:RUNNER_TEMP\qbe.tar.xz"
          tar xf "$env:RUNNER_TEMP\qbe.tar.xz" -C "$env:RUNNER_TEMP"
          Push-Location "$env:RUNNER_TEMP\qbe-1.3"
          Set-Content -Path config.h -Value "#define Deftgt T_amd64_win"
          $winabi = Get-Content -Path "amd64\winabi.c" -Raw
          $needle = "emit(Ocopy, Kl, instr->to, SLOT(-slot_offset), R);"
          if (-not $winabi.Contains($needle)) { throw "qbe amd64_win yamasi: beklenen satir bulunamadi (upstream degismis olabilir)" }
          $winabi = $winabi.Replace($needle, "emit(Ocopy, instr->cls, instr->to, SLOT(-slot_offset), R);")
          Set-Content -Path "amd64\winabi.c" -Value $winabi -NoNewline
          cc -O2 -std=c99 -o qbe.exe *.c amd64/*.c arm64/*.c rv64/*.c
          if ($LASTEXITCODE -ne 0) { throw "qbe derlemesi basarisiz (exit $LASTEXITCODE)" }
          Pop-Location
          Copy-Item "$env:RUNNER_TEMP\qbe-1.3\qbe.exe" "$env:RUNNER_TEMP\qbe.exe"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP"

      # Faz LL.6 — GERÇEK bir Nox programının uçtan uca (lex→parse→check→
      # codegen→qbe→cc→çalıştır) Windows'ta ÇALIŞTIĞININ İLK doğrulaması.
      # `subcommand_test.zig`nin AYNI deseni: exit code 0 VE stdout'un
      # BEKLENEN metni İÇERMESİ ayrı ayrı kontrol edilir (Nox programının
      # KENDİSİ `process.exit` ÇAĞIRMADIĞI SÜRECE çıkış kodu HER ZAMAN 0'dır
      # — `print`in bastığı değer ASLA çıkış koduna YANSIMAZ).
      - name: Duman testi — noxc.exe run (gercek qbe+cc baglama)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Content -Path run_smoke.nox -Value "print(21 + 21)" -NoNewline
          $output = & ".\zig-out\bin\noxc.exe" run run_smoke.nox
          if ($LASTEXITCODE -ne 0) { throw "noxc run basarisiz (exit $LASTEXITCODE): $output" }
          if ($output -ne "42") { throw "noxc run yanlis cikti: '$output' (beklenen '42')" }

      # Faz "sunucu-tarafı TLS terminasyonu + WebSocket Upgrade" (bkz. plan
      # dosyası): kullanıcının AÇIKÇA seçtiği "Windows'u da TAM doğrula"
      # kararının GERÇEK CI uygulaması. `tls_server.zig`nin Windows dalı
      # (`Kernel32.LoadLibraryA`) bare-isim ARAMASI KULLANIR — bu YÜZDEN
      # `libssl-3-x64.dll`nin GERÇEKTEN PATH'te bulunması GEREKİR. Chocolatey
      # paketinin KURDUĞU DLL'in TAM yolunu `NOX_OPENSSL_LIB` ORTAM
      # DEĞİŞKENİNE (bkz. `tls_server.zig`nin `openLib`inin belge notu — HER
      # DİĞER adaydan ÖNCE denenir) YAZMAK, PATH'in bu iş adımından SONRAKİ
      # bir GitHub Actions adımına GERÇEKTEN yayılıp yayılmadığına
      # GÜVENMEK YERİNE %100 GÜVENİLİR bir garanti sağlar.
      - name: OpenSSL kur (Windows — TLS testleri icin)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # NOT: `choco`nun KENDİ çıktısı (`Out-Null` İLE GİZLENMEDEN)
          # GÖRÜNÜR bırakılır. **GERÇEK bir CI çalıştırmasıyla BULUNAN İKİ
          # hata:** (1) `openssl.light` (v3.1.4) GERÇEKTE `C:\Program
          # Files\OpenSSL`e kurulur (`OpenSSL-Win64` DEĞİL — bkz. çıktının
          # KENDİSİ, "Deployed to 'C:\Program Files\OpenSSL\'"); (2) BUNU
          # BİLMEDEN önce eklenen "C:\Program Files altında HERHANGİ bir
          # `libssl-*.dll`" SON ÇARE taraması, `windows-latest` çalıştırıcısında
          # ÖNCEDEN kurulu AWS CLI'nin KENDİ BAĞIMSIZ `libssl-3.dll`sini
          # (`C:\Program Files\Amazon\AWSCLIV2\`, alfabetik olarak
          # "OpenSSL"DEN ÖNCE geldiği İçİn İLK eşleşen) buluyordu — bu
          # BAŞKA bir uygulamanın KENDİ paketlediği, uyumsuz/eksik bir
          # libssl kopyası olduğundan `newServerCtx` SESSİZCE başarısız
          # oluyordu (TLS sunucusu HİÇ dinlemeye BAŞLAMADI). Düzeltme: KESİN
          # kurulum yolu `C:\Program Files\OpenSSL` İLK sırada denenir,
          # GENİŞ "C:\ TARAMASI" YEDEĞİ TAMAMEN KALDIRILDI (yanlış-pozitif
          # riski, HİÇ bulamamaktan DAHA KÖTÜ — sessizce YANLIŞ bir
          # kütüphaneyi seçip anlaşılmaz bir zaman aşımına yol açar).
          choco install openssl.light -y --no-progress
          $ErrorActionPreference = "Stop"

          $roots = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files (x86)\OpenSSL-Win64",
            "C:\Program Files\OpenSSL-Win32",
            "C:\ProgramData\chocolatey\lib\openssl.light",
            "C:\ProgramData\chocolatey\lib\openssl"
          )
          $dll = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $dll = Get-ChildItem -Path $root -Filter "libssl-*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dll) { break }
            }
          }
          if (-not $dll) { throw "libssl DLL bulunamadi (openssl.light kurulumu basarisiz olabilir ya da kurulum yolu tekrar degismis olabilir)" }
          Write-Host "libssl bulundu: $($dll.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "NOX_OPENSSL_LIB=$($dll.FullName)"

          # NOT: `libssl-3-x64.dll`, KENDİ `libcrypto-3-x64.dll` bağımlılığını
          # (Windows PE import tablosu ÜZERİNDEN) taşır. `LoadLibraryA` MUTLAK
          # bir yolla ÇAĞRILDIĞINDA SADECE O TEK DLL'i o yoldan yükler —
          # onun BAĞIMLILIKLARI (libcrypto) YİNE standart Windows DLL arama
          # SIRASIYLA (uygulamanın kendi dizini, sistem dizini, PATH) çözülür;
          # `libssl-3-x64.dll`nin BULUNDUĞU dizin bu aramaya DAHİL DEĞİLDİR
          # (aksi halde LOAD_WITH_ALTERED_SEARCH_PATH GEREKİR). Bu YÜZDEN
          # OpenSSL dizini PATH'e EKLENMEZSE, `LoadLibraryA(libssl yolu)`
          # SESSİZCE BAŞARISIZ olabilir (libcrypto bulunamadığı İçİn) — bu,
          # `newServerCtx`nin `ensureLoaded()` adımında BAŞARISIZ olup TLS
          # sunucusunun HİÇ dinlemeye BAŞLAMAMASINA yol açar. Düzeltme: OpenSSL
          # dizinini bu JOB'un KALAN adımları İçin PATH'e EKLE.
          $cryptoDll = Get-ChildItem -Path $dll.DirectoryName -Filter "libcrypto-*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cryptoDll) { Write-Host "libcrypto bulundu: $($cryptoDll.FullName)" } else { Write-Host "UYARI: libcrypto-*.dll $($dll.DirectoryName) icinde bulunamadi" }
          Add-Content -Path $env:GITHUB_PATH -Value $dll.DirectoryName

      # `tests/fixtures/tls/test_cert.pem`/`test_key.pem` (SABİT, ÖNCEDEN
      # macOS'ta `openssl req -x509 ... -subj "/CN=localhost"` İLE üretilmiş
      # test-only self-signed çift) DOĞRUDAN kullanılır — self-signed bir
      # sertifika+anahtar çifti PLATFORM-BAĞIMSIZDIR, Windows'ta YENİDEN
      # ÜRETMEYE GEREK YOK.
      - name: Duman testi — nox.http.serve_tls (GERCEK OpenSSL FFI, Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # NOT: PowerShell here-string'leri (`@'...'@`) sınırlayıcılarının
          # SATIRIN İLK SÜTUNUNDA olmasını GEREKTİRİR — bu, YAML'ın `run: |`
          # blok skaler GİRİNTİ tutarlılığı KURALIYLA ÇAKIŞIR (GERÇEK bir
          # CI ayrıştırma hatasıyla BULUNDU: girinti aniden düşünce YAML
          # blok skaleri ERKEN SONLANDIRIYORDU). Düzeltme: bir DİZİ satır +
          # `-join "`n"` (HİÇBİR satırın SÜTUN-0 KISITINA uyması GEREKMEZ).
          # NOT: `Content-Type` başlığı KASITLI OLARAK eklendi — GERÇEK bir
          # CI çalıştırmasıyla BULUNDU: başlıksız bir yanıtta PowerShell'in
          # `Invoke-WebRequest -UseBasicParsing`i `$resp.Content`yi bir
          # STRING DEĞİL, HAM `byte[]` olarak dönüyordu — bu, string
          # interpolasyonunda ("$($resp.Content)") İÇERİĞİ "111 107 45 ..."
          # (ASCII kodlarının ONDALIK karşılıkları, boşlukla ayrılmış) OLARAK
          # YAZDIRIYORDU, `-ne "ok-windows-tls"` KARŞILAŞTIRMASINI HER ZAMAN
          # BAŞARISIZ kılıyordu — TLS handshake+HTTP yanıtının KENDİSİ
          # ASLINDA BAŞARILI olsa BİLE.
          $lines = @(
            'import nox.http',
            'from nox.http import HttpRequest',
            'from nox.http import HttpResponse',
            '',
            'def handle(req: HttpRequest) -> HttpResponse:',
            '    return HttpResponse(200, "ok-windows-tls", {"Content-Type": "text/plain"})',
            '',
            'def run() -> None:',
            '    nox.http.serve_tls(18443, handle, "tests/fixtures/tls/test_cert.pem", "tests/fixtures/tls/test_key.pem", 1)',
            'run()'
          )
          Set-Content -Path tls_smoke.nox -Value ($lines -join "`n") -NoNewline
          & ".\zig-out\bin\noxc.exe" build tls_smoke.nox -o tls_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "serve_tls derlemesi basarisiz (exit $LASTEXITCODE)" }

          # NOT: ONCEKI surum, baglanti kurulamazsa DOGRUDAN `throw` ATIYORDU
          # — bu, betigin SONUNDAKI stderr-dump/kontrolune HIC ULASMADAN
          # cikmasina sebep oluyordu (GERCEK bir CI-tanılama hatasıyla
          # BULUNDU: dogru libssl DLL'i bulundugu HALDE baglanti KURULAMADIGI
          # bir calismada, ASIL sebep [orn. tls_smoke.exe'nin stderr'i, ya da
          # surecin erken cikip cikmadigi] HICBIR ZAMAN goruntulenemedi).
          # Duzeltme: hatayi bir DEGISKENDE biriktir, stderr'i/surec durumunu
          # HER ZAMAN yazdir, SONRA (varsa) hatayi fırlat.
          $proc = Start-Process -FilePath ".\tls_smoke.exe" -PassThru -NoNewWindow -RedirectStandardError "tls_smoke_stderr.txt"
          $failure = $null
          $resp = $null
          try {
            $connected = $false
            for ($i = 0; $i -lt 50; $i++) {
              Start-Sleep -Milliseconds 200
              try {
                $resp = Invoke-WebRequest -Uri "https://127.0.0.1:18443/hello" -SkipCertificateCheck -UseBasicParsing -TimeoutSec 2
                $connected = $true
                break
              } catch { Start-Sleep -Milliseconds 100 }
            }
            if (-not $connected) {
              $procState = if ($proc.HasExited) { "surec ERKEN SONLANDI, ExitCode=$($proc.ExitCode)" } else { "surec HALA CALISIYOR (port dinlemiyor olabilir)" }
              $failure = "serve_tls'e GERCEK bir HTTPS baglantisi kurulamadi (50 deneme). $procState"
            } elseif ($resp.StatusCode -ne 200) {
              $failure = "beklenmeyen durum kodu: $($resp.StatusCode)"
            } elseif ($resp.Content -ne "ok-windows-tls") {
              $failure = "beklenmeyen govde: '$($resp.Content)'"
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          Start-Sleep -Milliseconds 300
          $stderrContent = Get-Content -Path "tls_smoke_stderr.txt" -Raw -ErrorAction SilentlyContinue
          if ($stderrContent) {
            Write-Host "=== tls_smoke.exe stderr ==="
            Write-Host $stderrContent
            Write-Host "==========================="
          } else {
            Write-Host "tls_smoke.exe stderr bos."
          }
          if ($failure) { throw "$failure" }
          if ($stderrContent) { throw "sunucu stderr'e beklenmeyen bir cikti yazdi (olasi bellek sizintisi/UAF): $stderrContent" }
          Write-Host "nox.http.serve_tls Windows duman testi BASARILI: $($resp.Content)"

      # Faz "sunucu-tarafı TLS + WebSocket Upgrade" §6 (TAM 12'lik isim
      # matrisi) — Windows'ta (Windows qbe.exe + MinGW cc ile) HER
      # kombinasyonun GERÇEKTEN derlenip BAĞLANDIĞINI doğrular. Runtime
      # DAVRANIŞI (yalnızca `serve_tls`in YUKARIDA GERÇEK bir istemciyle
      # doğrulanması KADAR derin) BURADA sınanmaz — bu, YALNIZCA codegen/
      # link seviyesinde `_tls`/`_ws`/`_ws_tls` uzantılarının Windows QBE/cc
      # ikilisiyle de SORUNSUZ ürettiğinin kanıtıdır.
      - name: Duman testi — TAM 12'lik serve* isim matrisi derlenir (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = "tests/fixtures/tls/test_cert.pem"
          $key = "tests/fixtures/tls/test_key.pem"
          $variants = [ordered]@{
            "serve"                   = "nox.http.serve(0, handle, 1)"
            "serve_tls"               = "nox.http.serve_tls(0, handle, `"$cert`", `"$key`", 1)"
            "serve_ws"                = "nox.http.serve_ws(0, handle, ws_handle, 1)"
            "serve_ws_tls"            = "nox.http.serve_ws_tls(0, handle, ws_handle, `"$cert`", `"$key`", 1)"
            "serve_fd"                = "nox.http.serve_fd(nox.http.listen(0), handle, 1)"
            "serve_fd_tls"            = "nox.http.serve_fd_tls(nox.http.listen(0), handle, `"$cert`", `"$key`", 1)"
            "serve_fd_ws"             = "nox.http.serve_fd_ws(nox.http.listen(0), handle, ws_handle, 1)"
            "serve_fd_ws_tls"         = "nox.http.serve_fd_ws_tls(nox.http.listen(0), handle, ws_handle, `"$cert`", `"$key`", 1)"
            "serve_multicore"         = "nox.http.serve_multicore(0, handle, 2, 2)"
            "serve_multicore_tls"     = "nox.http.serve_multicore_tls(0, handle, 2, `"$cert`", `"$key`", 2)"
            "serve_multicore_ws"      = "nox.http.serve_multicore_ws(0, handle, 2, ws_handle, 2)"
            "serve_multicore_ws_tls"  = "nox.http.serve_multicore_ws_tls(0, handle, 2, ws_handle, `"$cert`", `"$key`", 2)"
          }
          foreach ($name in $variants.Keys) {
            $srcLines = @(
              'import nox.http',
              'import nox.websocket',
              'from nox.http import HttpRequest',
              'from nox.http import HttpResponse',
              'from nox.websocket import WebSocketServerConn',
              '',
              'def handle(req: HttpRequest) -> HttpResponse:',
              '    return HttpResponse(200, "ok", {})',
              '',
              'def ws_handle(conn: WebSocketServerConn) -> None:',
              '    msg: str = conn.recv()',
              '    if len(msg) > 0:',
              '        conn.send_text(msg)',
              '',
              'def run() -> None:',
              "    $($variants[$name])",
              'run()'
            )
            Set-Content -Path "matrix_$name.nox" -Value ($srcLines -join "`n") -NoNewline
            & ".\zig-out\bin\noxc.exe" build "matrix_$name.nox" -o "matrix_$name.exe"
            if ($LASTEXITCODE -ne 0) { throw "'$name' derlemesi basarisiz (exit $LASTEXITCODE)" }
            Write-Host "'$name' derlemesi basarili."
          }
