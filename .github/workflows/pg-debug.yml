name: PG debug (geçici)

# GEÇİCİ: Linux runner'ında nox.postgres WASM testinin `memory access out of bounds` ile düşmesini daraltmak için (bkz. scripts/ci_pg_debug.sh).
# Kök neden bulunca bu dosya ve betik silinir. Yalnızca elle çalıştırılır.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Zig kur
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >>"$GITHUB_PATH"
      - name: binaryen kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen
      - name: Derle
        run: |
          zig build
          zig build wasm-rt
      - name: Teşhis
        run: bash scripts/ci_pg_debug.sh
      # CI'nın tam `zig build test` adımındaki ortamı (core dump yapılandırması, ulimit -c, NOX_CRASH_ARTIFACTS_DIR) yalnızca wasm testleri için taklit eder.
      - name: ci.yml ortamı + zig build wasm-test
        run: |
          sudo apt-get install -y -qq gdb
          mkdir -p /tmp/nox_cores /tmp/nox_crash_artifacts
          sudo sysctl -w kernel.core_pattern=/tmp/nox_cores/core.%e.%p
          ulimit -c unlimited
          export NOX_CRASH_ARTIFACTS_DIR=/tmp/nox_crash_artifacts
          zig build wasm-test 2>&1 | grep -E "error: '|surucu stderr|RuntimeError|BrkAllocator|nox_postgres|passed|failed" | head -20 || true
          echo "wasm-test bitti"
