name: AUR package

# `packaging/aur` ile üretilen `noxc-bin` paketini temiz bir Arch Linux container'ında GERÇEKTEN derler (makepkg), `.SRCINFO`yu
# `makepkg --printsrcinfo` ile karşılaştırır, kurar, programları çalıştırır, `noxc upgrade` korumasını sınar ve kaldırır.
# Kaynak: mevcut bir release (boşsa en son kararlı sürüm). Sürüm kesmeden denemek için elle çalıştır ya da `packaging/aur/**` değişince.
# Gerçek AUR yayımı `release.yml`in `aur` işindedir.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Kaynak release etiketi (boş: en son kararlı sürüm)"
        required: false
        default: ""
  push:
    paths:
      - "packaging/aur/**"
      - "scripts/update_aur_package.py"
      - ".github/workflows/aur.yml"

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Etiketi belirle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="$(gh release view --repo mburakmmm/nox-lang --json tagName --jq .tagName)"; fi
          echo "kaynak sürüm: $tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Arch Linux'ta derle, kur, çalıştır, kaldır
        run: docker run --rm -e TAG="$TAG" -v "$PWD:/w:ro" archlinux:base-devel bash /w/packaging/aur/test-in-arch.sh
